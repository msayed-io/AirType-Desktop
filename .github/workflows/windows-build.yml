name: Windows Desktop CI and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build-test-package-release:
    name: Build, test, package, and release Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js for Orb asset verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/orb/package-lock.json

      - name: Build official thinking-orbs WebView2 asset
        shell: pwsh
        run: |
          npm ci --prefix web/orb --ignore-scripts
          npm run build --prefix web/orb

      - name: Resolve automatic version
        id: version
        shell: pwsh
        run: |
          $base = Select-String -Path src/LiveTypeBridge.App/LiveTypeBridge.App.csproj -Pattern '<Version>([^<]+)</Version>' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $parts = $base.Split('.')
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $version = "0.0.0-pr.${{ github.event.number }}.${{ github.run_number }}"
          } else {
            $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV
          "BUILD_CONFIGURATION=${{ inputs.configuration || 'Release' }}" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          Write-Host "Resolved version: $version"

      - name: Restore solution for Windows x64
        run: dotnet restore LiveTypeBridge.sln --runtime $env:RUNTIME_IDENTIFIER

      - name: Build solution
        run: dotnet build LiveTypeBridge.sln --configuration $env:BUILD_CONFIGURATION --no-restore --nologo -p:Version=${{ steps.version.outputs.version }}

      - name: Run tests
        run: dotnet test LiveTypeBridge.sln --configuration $env:BUILD_CONFIGURATION --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults --nologo

      - name: Publish self-contained Windows application
        run: >-
          dotnet publish src/LiveTypeBridge.App/LiveTypeBridge.App.csproj
          --configuration $env:BUILD_CONFIGURATION
          --runtime $env:RUNTIME_IDENTIFIER
          --self-contained true
          --no-restore
          --output publish/AirType-win-x64
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create portable ZIP from the same publish output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = "artifacts/AirType-portable-win-x64-${{ steps.version.outputs.version }}-${{ github.run_number }}.zip"
          Compress-Archive -Path "publish/AirType-win-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AirType-ci-win-x64-${{ github.run_number }}
          path: |
            artifacts/*.zip
            publish/AirType-win-x64/AirType.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release from this exact build
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install --global vpk --version 1.2.161
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GITHUB_TOKEN
          vpk pack -u AirType -v $env:VERSION -p publish/AirType-win-x64 --mainExe AirType.exe
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --publish --releaseName "AirType $env:VERSION" --tag $env:RELEASE_TAG --token $env:GITHUB_TOKEN
